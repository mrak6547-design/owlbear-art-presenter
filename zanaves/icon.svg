<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5dfa2"/>
      <stop offset="0.35" stop-color="#d9b56c"/>
      <stop offset="0.7" stop-color="#a5811d"/>
      <stop offset="1" stop-color="#e9cf8e"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.35" r="1">
      <stop offset="0" stop-color="#241a0c"/>
      <stop offset="1" stop-color="#0b0805"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a12"/>
      <stop offset="1" stop-color="#0e0a06"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- внешняя рамка -->
  <rect x="18" y="18" width="220" height="220" rx="30" fill="none" stroke="url(#gold)" stroke-width="10"/>
  <rect x="34" y="34" width="188" height="188" rx="22" fill="none" stroke="#7c6114" stroke-width="3" opacity="0.8"/>

  <!-- внутреннее паспарту -->
  <rect x="56" y="56" width="144" height="144" rx="16" fill="#0e0a06" stroke="#5a4315" stroke-width="2"/>

  <!-- пейзаж: солнце -->
  <circle cx="128" cy="96" r="26" fill="#e9cf8e" opacity="0.9"/>
  <circle cx="128" cy="96" r="34" fill="none" stroke="#e9cf8e" stroke-width="2" opacity="0.35"/>

  <!-- горы -->
  <path d="M62 176 L102 112 L122 138 L146 104 L194 176 Z" fill="url(#sky)" stroke="#a5811d" stroke-width="2" stroke-linejoin="round"/>
  <path d="M84 176 L112 138 L128 154 L142 140 L172 176 Z" fill="#161009"/>

  <!-- фигура искателя -->
  <g fill="#e4cf8f" opacity="0.95">
    <circle cx="96" cy="138" r="5"/>
    <path d="M96 144 L96 160 L92 170 L88 176 L93 176 L97 168 L101 176 L106 176 L101 162 L100 144 Z"/>
    <path d="M96 142 L88 148 L86 153 L89 152 L96 147 L103 151 L106 153 L104 147 L96 142 Z"/>
  </g>

  <!-- уголки -->
  <g fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round">
    <path d="M40 58 V44 Q40 40 44 40 H58"/>
    <path d="M216 58 V44 Q216 40 212 40 H198"/>
    <path d="M40 198 V212 Q40 216 44 216 H58"/>
    <path d="M216 198 V212 Q216 216 212 216 H198"/>
  </g>
</svg>
