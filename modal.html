<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="stylesheet" href="./style.css">
  <title>Art Show Viewer</title>
</head>
<body class="viewer">
  <div id="backdrop" class="backdrop"></div>
  <div id="frame" class="frame" role="dialog" aria-modal="true">
    <div id="stage" class="stage">
      <img id="img" alt="" draggable="false">
      <div id="status" class="status">Загрузка…</div>
    </div>
    <div id="caption" class="caption hidden"></div>
    <div class="toolbar">
      <button id="reset" class="chip" type="button">1:1</button>
      <button id="close-all" class="chip chip-danger hidden" type="button">Убрать у всех</button>
    </div>
    <button id="close" class="close" type="button" aria-label="Закрыть">×</button>
  </div>
  <script type="module" src="./modal.js"></script>
</body>
</html>
