<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0f00"/>
      <stop offset="100%" style="stop-color:#2d1a00"/>
    </linearGradient>
    <linearGradient id="frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b8860b"/>
      <stop offset="50%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#b8860b"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect x="2" y="2" width="60" height="60" rx="6" fill="url(#bg)"/>
  <!-- Outer frame -->
  <rect x="3" y="3" width="58" height="58" rx="5" fill="none" stroke="url(#frame)" stroke-width="2"/>
  <!-- Inner frame -->
  <rect x="7" y="7" width="50" height="50" rx="3" fill="none" stroke="url(#frame)" stroke-width="1" opacity="0.5"/>
  <!-- Image icon -->
  <rect x="12" y="14" width="40" height="28" rx="2" fill="#2d1a00" stroke="#b8860b" stroke-width="1.5"/>
  <!-- Mountain scene inside -->
  <path d="M14 40 L24 24 L32 34 L38 28 L50 40 Z" fill="#4a3000" opacity="0.8"/>
  <!-- Sun circle -->
  <circle cx="43" cy="22" r="5" fill="#ffd700" opacity="0.7"/>
  <!-- Caption bar at bottom -->
  <rect x="12" y="46" width="40" height="6" rx="1" fill="#4a3000"/>
  <!-- Caption lines -->
  <rect x="16" y="48" width="22" height="1.5" rx="0.75" fill="#b8860b" opacity="0.8"/>
  <!-- Corner ornaments -->
  <circle cx="12" cy="14" r="1.5" fill="#ffd700" opacity="0.6"/>
  <circle cx="52" cy="14" r="1.5" fill="#ffd700" opacity="0.6"/>
  <circle cx="12" cy="42" r="1.5" fill="#ffd700" opacity="0.6"/>
  <circle cx="52" cy="42" r="1.5" fill="#ffd700" opacity="0.6"/>
</svg>
